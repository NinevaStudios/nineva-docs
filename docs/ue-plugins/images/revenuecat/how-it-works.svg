<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b80"/>
    </marker>
  </defs>

  <!-- card background so the diagram reads well in both light and dark themes -->
  <rect x="1" y="1" width="798" height="298" rx="14" fill="#ffffff" stroke="#e3e0ea"/>

  <!-- column titles -->
  <g font-size="12" fill="#6b6b80" font-weight="600" letter-spacing="0.6" text-anchor="middle">
    <text x="105" y="34">STORES</text>
    <text x="330" y="34">REVENUECAT</text>
    <text x="545" y="34">PLUGIN</text>
    <text x="710" y="34">YOUR GAME</text>
  </g>

  <!-- stores -->
  <g font-size="14" fill="#1f1f2e" text-anchor="middle">
    <rect x="30" y="58" width="150" height="46" rx="8" fill="#f6f5f9" stroke="#cfcbdb"/>
    <text x="105" y="86">Google Play</text>
    <rect x="30" y="122" width="150" height="46" rx="8" fill="#f6f5f9" stroke="#cfcbdb"/>
    <text x="105" y="150">App Store</text>
    <rect x="30" y="186" width="150" height="46" rx="8" fill="#f6f5f9" stroke="#cfcbdb"/>
    <text x="105" y="208">Stripe</text>
    <text x="105" y="224" font-size="11" fill="#6b6b80">(Web Billing)</text>
  </g>
  <text x="105" y="262" font-size="11.5" fill="#6b6b80" text-anchor="middle">take the payment</text>

  <!-- RevenueCat backend -->
  <rect x="245" y="58" width="170" height="174" rx="10" fill="#fff1f2" stroke="#f2545b" stroke-width="1.6"/>
  <g font-size="13" fill="#1f1f2e" text-anchor="middle">
    <text x="330" y="88" font-size="15" font-weight="700" fill="#d63a42">RevenueCat</text>
    <text x="330" y="118">validates receipts</text>
    <text x="330" y="142">entitlements</text>
    <text x="330" y="166">offerings</text>
    <text x="330" y="190">subscriptions</text>
    <text x="330" y="214">analytics</text>
  </g>
  <text x="330" y="262" font-size="11.5" fill="#6b6b80" text-anchor="middle">configured in the dashboard</text>

  <!-- plugin -->
  <rect x="470" y="96" width="150" height="98" rx="10" fill="#f6effa" stroke="#8930b1" stroke-width="1.6"/>
  <g text-anchor="middle" fill="#1f1f2e">
    <text x="545" y="126" font-size="14" font-weight="700" fill="#8930b1">RevenueCat</text>
    <text x="545" y="144" font-size="14" font-weight="700" fill="#8930b1">Subsystem</text>
    <text x="545" y="168" font-size="11.5" fill="#6b6b80">Android / iOS SDK</text>
    <text x="545" y="183" font-size="11.5" fill="#6b6b80">Desktop: REST API</text>
  </g>

  <!-- game -->
  <rect x="660" y="96" width="110" height="98" rx="10" fill="#f6f5f9" stroke="#cfcbdb"/>
  <g font-size="13" fill="#1f1f2e" text-anchor="middle">
    <text x="715" y="128">paywall</text>
    <text x="715" y="150">unlock</text>
    <text x="715" y="168">content</text>
  </g>
  <text x="715" y="262" font-size="11.5" fill="#6b6b80" text-anchor="middle">Blueprint / C++</text>

  <!-- arrows -->
  <g stroke="#6b6b80" stroke-width="1.6" fill="none" marker-end="url(#a)" marker-start="url(#a)">
    <line x1="182" y1="81" x2="243" y2="110"/>
    <line x1="182" y1="145" x2="243" y2="145"/>
    <line x1="182" y1="209" x2="243" y2="180"/>
    <line x1="417" y1="145" x2="468" y2="145"/>
    <line x1="622" y1="145" x2="658" y2="145"/>
  </g>
  <text x="442" y="136" font-size="10.5" fill="#6b6b80" text-anchor="middle">Customer</text>
  <text x="442" y="162" font-size="10.5" fill="#6b6b80" text-anchor="middle">Info</text>
</svg>
